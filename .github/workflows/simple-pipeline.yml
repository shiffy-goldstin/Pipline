name: Classroom CI-CD Demo 2026

on:
  push:
    branches:
      - main

jobs:
   build_stage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build


     test_stage:
    needs: build_stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

    deploy_stage:
    runs-on: ubuntu-latest
    needs: test_stage
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Simulate Staging Deployment
        run: |
          echo "Preparing deployment to Staging environment..."
          echo "Transferring application artifacts..."
          echo "Deployment to Staging completed successfully!"