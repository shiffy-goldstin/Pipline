name: Classroom CI-CD Demo 2026

on:
  push:
    branches:
      - main

jobs:
  build_stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Build Process
        run: |
          echo "Starting build process..."
          echo "Building project files..."
          echo "Build completed successfully!"

  test_stage:
    runs-on: ubuntu-latest
    needs: build_stage
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Simulation Tests
        run: |
          python -c '
          print("Starting Python test simulation...")
          print("Checking application logic...")
          success = True
          if success:
              print("All Python tests passed successfully!")
          else:
              exit(1)
          '